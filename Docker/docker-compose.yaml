version: '3'

services:
  database:
    image: postgres:13.16-bookworm
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=biere
    volumes:
      - database-data:/var/lib/postgresql/data
    networks:
      - database-network

  database-manager:
    image: dpage/pgadmin4
    restart: always
    ports:
      - 8000:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=email@example.com
      - PGADMIN_DEFAULT_PASSWORD=password
      - PGADMIN_LISTEN_PORT=80
    networks:
      - database-network

volumes:
  database-data:

networks:
  database-network: